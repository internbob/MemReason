[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memreason-rl"
version = "0.1.0"
description = "Auditable asynchronous ADNI cognitive and structural memory modeling"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "PyYAML", "torch", "nibabel", "scipy", "scikit-learn"]

[project.optional-dependencies]
text = ["transformers", "peft"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["memreason_rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
