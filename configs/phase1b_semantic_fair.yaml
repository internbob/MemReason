experiment: phase1b_semantic_fair
run_id: phase1b_semantic_fair_20261003
seed: 2026
neural_seeds: [2026, 2027, 2028]
arms:
  - numeric_only
  - variable_name
  - task_semantics
text_encoder:
  path: /home_data/home/zhouwl2023/project/New-AD/TAB-AD/models/Bio_ClinicalBERT
  frozen: true
  pooling: masked_mean
  max_length: 128
inputs:
  verified_from_dictionary: true
  use_for_state: true
  scalar_monotonic_only: true
  exclude_prefixes: [dxsum_, faq_]
  note: All arms use the identical item values, masks, times, feature order and trainable architecture.
targets:
  adas_total13: ADAS13
  cdr_cdrsb: CDRSB
  faq_faqtotal: FAQ
  mmse_mmscore: MMSE
  moca_moca: MoCA
future_forecast:
  horizons_months: [6, 12, 24, 36]
  tolerance_months: {6: 3, 12: 3, 24: 6, 36: 6}
cross_scale:
  - name: adas_cdr_to_moca
    source_prefixes: [adas_, cdr_]
    target: moca_moca
  - name: mmse_cdr_to_adas
    source_prefixes: [mmse_, cdr_]
    target: adas_total13
model:
  descriptor_input_dim: 768
  descriptor_dim: 32
  hidden_dim: 128
  layers: 2
  dropout: 0.1
training:
  batch_size: 256
  max_epochs: 40
  patience: 7
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip: 1.0
  selection_metric: validation_macro_normalized_mae
statistics:
  bootstrap_replicates: 2000
  bootstrap_unit: subject
  confidence_level: 0.95
  primary_contrast: task_semantics ensemble minus numeric_only ensemble
test_policy: evaluate_all_frozen_checkpoints_once_after_all_validation_training
